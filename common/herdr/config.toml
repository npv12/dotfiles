onboarding = false

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true

[keys]
# tmux: prefix+" (split-window -v) -> stacked
split_horizontal = 'prefix+"'
# tmux: prefix+% (split-window -h) -> side-by-side
split_vertical = "prefix+%"

[ui]
agent_panel_scope = "all"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "herdr"
